services:
  clickhouse:
    image: ${HONEYPOT_CLICKHOUSE_IMAGE:-clickhouse/clickhouse-server:25.8.28.1@sha256:a9d328123ff8a61bf6b16448528b577d59deb85758172e13b09054b0727f8adf}
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${HONEYPOT_CLICKHOUSE_DATABASE:-honeynet_analytics}
      CLICKHOUSE_USER: honeynet_migrate
      CLICKHOUSE_PASSWORD: ${HONEYPOT_CLICKHOUSE_MIGRATE_PASSWORD:?set HONEYPOT_CLICKHOUSE_MIGRATE_PASSWORD in the protected env file}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      HONEYPOT_CLICKHOUSE_APP_PASSWORD_SHA256: ${HONEYPOT_CLICKHOUSE_APP_PASSWORD_SHA256:?set HONEYPOT_CLICKHOUSE_APP_PASSWORD_SHA256 in the protected env file}
      HONEYPOT_CLICKHOUSE_INGEST_PASSWORD_SHA256: ${HONEYPOT_CLICKHOUSE_INGEST_PASSWORD_SHA256:?set HONEYPOT_CLICKHOUSE_INGEST_PASSWORD_SHA256 in the protected env file}
      HONEYPOT_CLICKHOUSE_QUERY_PASSWORD_SHA256: ${HONEYPOT_CLICKHOUSE_QUERY_PASSWORD_SHA256:?set HONEYPOT_CLICKHOUSE_QUERY_PASSWORD_SHA256 in the protected env file}
    ports:
      - "127.0.0.1:${HONEYPOT_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${HONEYPOT_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - honeynet_clickhouse_data:/var/lib/clickhouse
      - ./init/bootstrap.sh:/opt/honeynet-clickhouse/bootstrap.sh:ro
      # Repository migrations are the single source of truth in source and release packages.
      - ../../migrations/clickhouse:/opt/honeynet-clickhouse/migrations:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - clickhouse-client --host 127.0.0.1 --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1" >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true

volumes:
  honeynet_clickhouse_data:
    name: ${HONEYPOT_CLICKHOUSE_VOLUME:-honeynet_analytics_clickhouse_data}
