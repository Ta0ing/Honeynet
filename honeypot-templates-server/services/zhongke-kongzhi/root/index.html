    <script type="text/javascript">
        function showVersion() {
            window.open('version.php', 'version', 'height=300,width=400,top=200,left=300,toolbar=no,menubar=no,scrollbars=no,resizable=no,location=no,status=no');

        function setLanguage() {

            window.location.href = 'language_set.php?lan=' + document.getElementById('lang').value;
        }

        function dkeyCheck() {
            if (!!window.ActiveXObject || "ActiveXObject" in window) {
                if (document.getElementById("dkey_login").checked) {
                    document.getElementById("activespan").innerHTML =
                        '<object classid="clsid:A57F0E7A-15B5-46D1-AA88-51B81AFCA732" id="active" width="0" height="0" codebase="rcweb.cab#Version=1,4,4,0"></object>';
                }

            } else {
                alert('仅能在IE浏览器上进行Dkey登录');
                document.getElementById("dkey_login").checked = false;
            }
        }

        function clearValue() {
            document.getElementById('user_name').value = '';
            document.getElementById('password').value = '';
        }
