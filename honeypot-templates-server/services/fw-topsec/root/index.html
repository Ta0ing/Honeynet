  <script language="javascript">

    function loginCheck() {
      if (theForm.username.value == "") {
        alert("请输入管理员名");
        theForm.username.focus();
        return false;
      }

      else if (theForm.passwd.value == "") {
        alert("请输入口令");
        theForm.passwd.focus();
        return false;
      }

      return true;

    }

  </script>

            <input class="text" type="password" name="password">

            <input type="submit" class="IndexPut" name="loginSubmitIpt" value="登录" onclick="return loginCheck()">
