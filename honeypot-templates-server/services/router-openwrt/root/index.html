<form method="post" action="/login"><div class="cbi-map">
		<h2 name="content">需要授权</h2>
		<div class="cbi-map-descr">
			请输入用户名和密码。
		</div>
		<div class="cbi-section"><div class="cbi-section-node">
			<div class="cbi-value">
				<label class="cbi-value-title">用户名</label>
				<div class="cbi-value-field">
					<input class="cbi-input-text" type="text" name="username" value="root" />
				</div>
			</div>
			<div class="cbi-value cbi-value-last">
				<label class="cbi-value-title">密码</label>
				<div class="cbi-value-field">
					<input class="cbi-input-text" type="password" name="password" />
				</div>
			</div>
		</div></div>
	</div>

	<div class="cbi-page-actions">
		<input type="submit" value="登录" class="cbi-button cbi-button-apply" />
		<input type="reset" value="复位" class="cbi-button cbi-button-reset" />
	</div>
</form>
