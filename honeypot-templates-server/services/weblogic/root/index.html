<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01//EN" "http://www.w3.org/TR/html4/strict.dtd">
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>Oracle WebLogic Server 管理控制台</title>
  <link rel="stylesheet" type="text/css" href="./general.css">
  <link rel="stylesheet" type="text/css" href="./window.css">
  <link rel="stylesheet" type="text/css" href="./login.css">

  <script type="text/javascript">
    // Disable frame hijacking  
    if (top != self) top.location.href = location.href;
  </script>

  <style type="text/css">
    html {
      background-color: #185E87;
    }
  </style>
</head>

<body onload="document.loginData.j_username.focus();">
  <div id="top">
    <div id="login-header">
      <div id="logo">

        <img src="./Branding_Login_WeblogicConsole.gif" alt="Oracle WebLogic Server 管理控制台 ">
      </div>
    </div>
    <div id="content">
      <div id="sidebar">
        <img src="./Login_11gLogo1.gif" alt="">
      </div>
      <div id="login">
        <div id="title">
          欢迎使用
        </div>
        <div id="login-form">

          <form id="loginData" name="loginData" method="post" action="login">
            <div class="message-row">
              <noscript>
                <p class="loginFailed">需要 JavaScript。启用 JavaScript 以便使用 WebLogic 管理控制台。</p>
              </noscript>



              <p>登录以使用 WebLogic Server 域</p>


            </div>
            <div class="input-row">
              <label for="j_username">
                用户名:</label>
              <span class="ctrl">
                <input class="textinput" type="text" autocomplete="on" name="username" id="j_username">
              </span>
            </div>
            <div class="input-row">
              <label for="j_password">
                口令:</label>
              <span class="ctrl">
                <input class="textinput" type="password" autocomplete="on" name="password" id="j_password">
              </span>
            </div>
            <div class="button-row">
              <span class="ctrl">
                <input class="formButton" type="submit"
                  onclick="form.submit();this.disabled=true;document.body.style.cursor = &#39;wait&#39;; this.className=&#39;formButton-disabled&#39;;"
                  value="登录">
              </span>
              <input type="hidden" name="j_character_encoding" value="UTF-8">
            </div>
          </form>
        </div>
      </div>
    </div>
    <div id="info">
    </div>
  </div>

  <div class="login-footer">
    <div class="info">

      <p id="footerVersion">WebLogic Server 版本: 10.3.6.0</p>
      <p id="copyright">版权所有 © 1996, 2011, Oracle 和/或其子公司。保留所有权利。</p>
      <p id="trademark">Oracle 是 Oracle Corporation 和/或其子公司的注册商标。其它名称可能是各自所有者的商标。</p>
    </div>
  </div>


</body>

</html>
