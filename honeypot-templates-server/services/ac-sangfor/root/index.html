	<script type="text/javascript">
		var load_flag = 0; //标记是否已加载完（触发body.onload）

		/**
		 * 使用私钥对密码加密
		 */
		function do_encrypt(txt) {
			var rsa = new RSAKey();
			rsa.setPublic(rsa_key, "10001");
			var res = rsa.encrypt(txt);

			if (res) {
				return res;
			}
			return ""
		}

		function doLogin() {
			var changeUserName = $("#changeUserName").val();
			var changePwd = $("#changePwd").val();

				$('#changeErr_info').html('提示：部署模式正在配置中，请稍后再提交登录！');
			} else if (rsa_key_error) {
				$('#changeErr_info').html('提示：登录组件加载失败，请刷新页面重新加载！');
			} else if (!rsa_key_success) {
				$('#changeErr_info').html('提示：登录组件正在加载中，请稍后再提交登录！');
			} else if (changeUserName == '') {
				$('#changeErr_info').html('提示：您还没输入用户名！');

				var param = '{"opr":"login", "data":{"user":"' + encodeString(changeUserName) + '", "pwd":"' + encodeString(do_encrypt(changePwd)) + '"}}';

				function changeSuccess(o) {

		/*
		*	@传入json字符串，返回json对象
		*/
		function json_decode(str) {
			var obj;
			try {
				obj = eval('(' + str + ')');
			}
			catch (exception) {
				obj = null;
			}
			return obj;
		}

		/*
		*	@判断传入的参数是否为空，只支持简单的字符类型
		*/
		function isEmpty(v) {
			return (v === null || v === undefined || v === '');
		}

		/*
		*	@ will be called on html body load
		*/
		function init() {
			load_flag = 1; //标记已加载完

			//如果曾经主动定位到某输入框，则不再自动定位到用户名输入框

		/*
		 * @获取TCP代理值
		 * Add by yuqiang 2010/09/20 for AC3.5 Tcp proxy
		 */
		function dealWithTcpProxy() {
			/* 获取URL参数中的scinfo值 */
			var args = new Object();	/* 声明一个空对象 */
			var param = window.location.search.substr(1);
			var pairs = param.split("&");
			for (var i = 0; i < pairs.length; i++) {
				var pos = pairs[i].indexOf("=");
				if (pos == -1)
					continue;
				var argname = pairs[i].substr(0, pos);
				var value = pairs[i].substr(pos + 1);
				args[argname] = value;
			}

			/* 判断是否有参数 */
			if (isEmpty(args["bbcuser"]) || isEmpty(args["ip"])) {
				updateTips('登录失败,请在远程控制服务中重新点击控制台');
				return false;
			}
			TcpChecking();

			str = '{"opr":"tcpproxy","data":{"bbcuser":"' + args["bbcuser"] + '","ip":"' + args["ip"] + '"}}';
		}

		function TcpChecking() {
			updateTips('TCP远程代理登录中,请稍后...');

		function TcpChecked() {

		function rep_err(txt) {

				return true;
			}

		/*
		*	@获取异步请求结果的 msg 字段信息

		function rep_err_msg(txt) {
			var obj = json_decode(txt);

			if (obj && obj.msg) {
				var str = obj.msg;
				if (str.indexOf("Cookie") >= 0 || str.indexOf("cookie") >= 0)
					return "请重启浏览器或者清空历史记录";
				else
					return obj.msg;
			}
			else {
				return '';
			}

		*	@版本信息异步请求的回调函数
		*	@txt异步请求的返回结果

				//空串会触发rsa库内部的弹框报错，空串时按错误来处理即可
				if (obj && obj.key != '') {
					rsa_key = obj.key;

					rsakey_errhandler(txt);

		//在TT下，按一次Enter键会响应两次
		function onKeydownOper(e) {

		/*
		*   @ encodeString
		*   @ author lenky 其实该段代码来之Ext.util.JSON，\(^o^)/~
		*   @ fixed bug21306 20100502
		*/
		function encodeString(s) {
			var m = {
				"\b": '\\b',
				"\t": '\\t',
				"\n": '\\n',
				"\f": '\\f',
				"\r": '\\r',
				'"': '\\"',
				"\\": '\\\\'
			};
			if (/["\\\x00-\x1f]/.test(s)) {
				return s.replace(/([\x00-\x1f\\"])/g, function (a, b) {
					var c = m[b];
					if (c) {
						return c;
					}
					c = b.charCodeAt();
					return "\\u00" +
						Math.floor(c / 16).toString(16) +
						(c % 16).toString(16);
				});
			}
			return s;
		}
		//end added
		//trim spaces char;
		function trim(s) {
			if (typeof s === 'string') {
				return s.replace(/^\s+|\s+$/g, '');

			return '';
		};
		/*
		*	@ submit data
		*/

		function onDo() {
			if (!load_flag) return; //还没加载完时直接返回，避免js错误

			try {

				var pu = $$("user");
				var pp = $$("password");

					updateTips("您还没输入用户名！");

				/* Add by yuqiang 2010/09/30 for AC3.5 TCP proxy */
				var args = new Object();	/* 声明一个空对象 */
				var url = window.document.location.href;

				/* 是否为TCP代理 */
				if (url.indexOf("127.0.0.1") != -1) {/* TCP代理 */
					var param = window.location.search.substr(1);
					var pairs = param.split("&");
					for (var i = 0; i < pairs.length; i++) {
						var pos = pairs[i].indexOf("=");
						if (pos == -1)
							continue;
						var argname = pairs[i].substr(0, pos);
						var value = pairs[i].substr(pos + 1);
						args[argname] = value;
					}

					/* 判断是否有参数 */
					if (isEmpty(args["scinfo"]) ||
						isEmpty(args["port"]) ||
						isEmpty(args["auth"])) {
						updateTips('登录失败,请在远程控制服务中重新点击控制台');
						return false;
					}
				}
				/* End add */

				var enc_pwd = '';
				if (!isEmpty(args['scinfo'])) {
					enc_pwd = encodeString(do_encrypt(pp.value)); //TCP代理无需组件加密
				}
				else {

					if (cur_mode == "-1") {
						updateTips('部署模式正在配置中，请稍后再提交登录！');
						return false;
					}

					if (rsa_key_error) {
						updateTips('登录组件加载失败，请刷新页面重新加载！');

					}
					if (!rsa_key_success) {
						updateTips('登录组件正在加载中，请稍后再提交登录！');
						return false;
					}

					enc_pwd = encodeString(do_encrypt(pp.value));
				}

				//fixed bug21306 20100502
				var str = ' {"opr":"login", "data":{"user": "';
				str += encodeString(pu.value);
				str += '" , "pwd": "';
				str += enc_pwd;
				str += '"';
				/* Add by yuqiang 2010/09/21 for AC3.5 TCP proxy */
				if (!isEmpty(args['scinfo'])) {
					var scinfo = decodeURIComponent(args["scinfo"]);
					str += ' , "scinfo":"' + scinfo + '"';
				}
				/* End add */
				str += '}} ';
				//end fixed

				updateTips('正在登录，请稍候...')
				asyncReq("POST", "../cgi-bin/login.cgi", str, cb_login);
			}
			catch (e) {
				alert("ActiveX不能正常运行\n-请检查控件是否已经下载,版本是否正确\n-请检查Internet安全级别的设置,将级别设置为中级以下\n-更改配置后请刷新页面");
			}

		/*
		*	@ async request
		*/
		var activex = ['MSXML2.XMLHTTP.3.0', 'MSXML2.XMLHTTP', 'Microsoft.XMLHTTP'];
		function releaseObject(o) {
			o.conn = null;
			o = null;
		}

		/*
		*	@method
		*	@uri
		*	@postdata param, maybe null
		*	@cb callback, maybe null. it was used to analyse responsetext
		*	@errhandler callback, maybe null.
		*/
		function asyncReq(method, uri, postdata, cb, errhandler, timeout) {
			var recv_finish = false;
			var o = getConnectionObject() || null;

			// bbc 的请求需要将路径加上
			var pathname = window.location.pathname;
			if (/\/device-\w+\//.test(pathname) || /\/template-\w+\//.test(pathname)) {
				uri = pathname.match(/.*\/(template|device)-\w+\//)[0] + uri.replace(/^(\.*\/?)/, "");
			}

			if (o) {
				o.conn.onreadystatechange = function handleReadyState() {

					if (o.conn.readyState != 4)
						return;

					var httpStatus, responseObject;

					try {
						if (o.conn.status !== undefined && o.conn.status != 0) {
							httpStatus = o.conn.status;
						} else {
							httpStatus = 13030;
						}
					} catch (e) {
						httpStatus = 13030;
					}

					recv_finish = true;
					if (httpStatus >= 200 && httpStatus < 300) {
						var rlt = o.conn.responseText;
						if (cb)
							cb(rlt);
					} else {
						if (errhandler)
							errhandler();
					}

					releaseObject(o);
				}

				o.conn.open(method, uri, true);
				o.conn.setRequestHeader("Content-Type", "Application/X-www-Form");
				o.conn.send(postdata || null);

				if (timeout) {
					setTimeout(function () {
						if (!recv_finish) {
							o.conn.abort();
							if (errhandler)
								errhandler();
						}
					}, timeout * 1000);
				}
			}

			return o;
		}

		/*
		*	@ get XMLHttpRequest
		*
		*/
		function getConnectionObject() {
			var o;

			try {
				o = createXhrObject();
			} catch (e) {
			} finally {
				return o;
			}
		}

		function createXhrObject() {
			var http;
			try {
				http = new XMLHttpRequest();
			} catch (e) {
				for (var i = 0; i < activex.length; ++i) {
					try {
						http = new ActiveXObject(activex[i]);
						break;
					} catch (e) { }
				}
			} finally {
				return { conn: http };
			}
		}

	// async finished
	</script>
