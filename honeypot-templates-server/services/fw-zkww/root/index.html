function isActivexInstall()
{
	var vRet = true;
	try
	{
		var RCkeyObj = new ActiveXObject("Bkey_Obj.1");
	}
	catch(e)
	{
		vRet = false;
	}
	return vRet;
}
	
function Get_Verify_Info(user,passwd)
{
	var verify_done = 1;
	var vUser = user;
	var vPassword = passwd;
	try
	{
		var RCkeyObj = new ActiveXObject("Bkey_Obj.1");
		var ret = RCkeyObj.GetVerifyInfo(vUser, vPassword);   
		if (ret == 0)
		{
			verify_done = 0;
		}
		else
		{
			verify_done = 1;
		}
	}
	catch(e)
	{
		verify_done = 1;
	}
	return verify_done;
}
