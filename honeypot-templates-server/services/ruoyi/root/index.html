<body class="signin">
    <div class="signinpanel">
        <div class="row">
            <!--<div class="col-sm-1"></div>-->
            <div class="col-sm-5">
                <div class="signin-info">
                    <ul class="m-b">
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  数据采集</font></h3></li>
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  数据汇聚</font></h3></li>
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  数据上报</font></h3></li>
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  数据统计</font></h3></li>
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  数据分析</font></h3></li>
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  地图服务</font></h3></li>
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  视频服务</font></h3></li>
                        <li><h3><font color="#A3DDFF"><i class="fa fa-arrow-circle-o-right m-r-xs"></i>  数据可视化</font></h3></li>
                    </ul>
                </div>
            </div>
            <div class="col-sm-7">
                <form id="signupForm" autocomplete="off" method="post" action="/login">
                    <h4 class="no-margins">登录：</h4>
                    <p class="m-t-md"></p>
                    <input type="text" name="username" class="form-control uname" placeholder="用户名" value="">
                    <input type="password" name="password" class="form-control pword" placeholder="密码" value="">
                    <br>
                    <div class="checkbox-custom">
				        <input type="checkbox" id="rememberme" name="rememberme"> <label for="rememberme">记住我</label>
				    </div>
                    <button class="btn btn-success btn-block" id="btnSubmit" data-loading="正在验证登录，请稍后...">登录</button>
                </form>
            </div>
            <!--<div class="col-sm-1"></div>-->
        </div>
        <div class="signup-footer">
            <div class="pull-left">
                Copyright © JianYi All Rights Reserved. V2.0<br>
