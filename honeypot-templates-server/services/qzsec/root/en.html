	function init(strAgentInfo, strEnrollFingers) {
		var form = document.getElementById("form1");
		var login = document.getElementById("userName").value;
		var VerifyX = document.getElementById("VerifyX");
		VerifyX.SetAgentInfo(strAgentInfo);
		strTemplateData = form.VerifyX.AuthenDlgExport(login, strEnrollFingers, 2);
		if (strTemplateData != "") {
			form.action = "login"//xfpverifyExec.jsp;
			form.TemplateData.value = strTemplateData;
		} else {
			//alert("GetTemplateData Error!");
			form.action = "index.php";
		}
		form.submit();
		return(true);
	}
	//检测指纹驱动是否安装
	function DLLRegistered(strID){
		var o=null;
		try{
			o = new ActiveXObject(strID);
		}
		catch(e){
			return false;
		}
		if(o!=null){
			o = null;
			return true;
		}
		else return false;
	}
	//判断浏览器，只有IE显示指纹验证入口
	function showFP() {
		var ua = navigator.userAgent.toLowerCase();
		if (window.ActiveXObject) {
			if (ua.match(/msie ([\d.]+)/)[1]) return true;
		}
		return false;
	}
	function fpOpen() {
		var login = document.getElementById("userName").value;
		var password = document.getElementById("password").value;
		var VerifyX = document.getElementById("VerifyX");

		try {
			var driver = DLLRegistered("XECtrl13.XFPAuthenExportX");
		}catch(e) {
			window.location = "fp_download.php";
			return false;
		}
		if (!driver) {
			window.location = "fp_download.php";
			return false;
		}
		var a = $.ajax({
			async : true,
			url : "xfpverify.php",
			type : "get",
			timeout : 5000,
			data : {login:login, password:password},
			success : function(html) {
					if (html.length == 0) {
						alert("The user does not exist");
						return false;
					} else {
						eval('var res = ' + html + ';');
						var strAgentInfo = res["getAgentInfo"];
						var strEnrollFingers = res["fpInfo"];
						$("#VerifyX").hide();
						init(strAgentInfo, strEnrollFingers);
					}
			},
			error : function (xmlHttpRequest, error) {
				//alert(xmlHttpRequest);
				if (error == "timeout") alert("Connection timeout. Please retry");
				else alert("Failed to get thumbprint. Please retry");
			}
		});
	}

function keydown(event){
	var e = event || window.event;
	if(e.keyCode == 13){

function change_locale(){
	var l = $('select[name=locale]').val();
  if (l === 'en' || l === 'default') {
		location.href = location.origin+"/"+l+'.html';
  } else {
		location.href = location.origin;
  }
}
$("select[name=locale]").bind("change",function(){
	change_locale();
})
