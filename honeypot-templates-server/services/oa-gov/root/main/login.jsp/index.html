<script>
    $(document).ready(function () {
        $(function () {
            $("label.overlabel").overlabel();

            var iconImg = "/images/login/graypoint.png";
            var iconImg_over = "/images/login/redpoint1.png";

            function pagerFactory(idx, slide) {
                var s = idx > 50 ? ' style="display:none"' : '';
                return ' <span class="m-t-5  slidnavtitle hand"  style="background:url(' + (idx == 0 ? iconImg_over : iconImg) + ') center center no-repeat;position:relative;height:32px;width:32px;z-index:10;padding:10px">&nbsp;</span>';
            };
            $("#login").bind("mouseover", function () {
                $(this).removeClass("lgsm");
                $(this).addClass("lgsmMouseOver");
            });
            $("#login").bind("mouseout", function () {
                $(this).removeClass("lgsmMouseOver");
                $(this).addClass("lgsm");
            });

            $(".crossNav a").hover(function () {
                $(this).css("background-position", "0 -29px");
            }, function () {
                $(this).css("background-position", "0 0px");
            });

            setRandomBg();
            var top = $(document.body).height() - $("#picblessingdiv").height();

            $("#picblessingdiv").css({"top": "" + top + "px"});
            $("#picblessingdivCloseBtnWrap").bind("click", function () {
                $("#picblessingdiv").hide();
            });
        });
        //焦点设置
        $("input[name='uname']").focus();
    });


    function setRandomBg() {
        const img = [];
        
        img.push('/ServiceAction/com.eweaver.document.file.FileDownload?&&loginIamge=1&&attachid=2c908a84773e303d01777f5c89842b65');
        
        img.push('/ServiceAction/com.eweaver.document.file.FileDownload?&&loginIamge=1&&attachid=2c908a82773e2c3a01777b53b9747f2b');
        
        img.push('/ServiceAction/com.eweaver.document.file.FileDownload?&&loginIamge=1&&attachid=2c908a84746c508b01746d2a69994c64');
        
        img.push('/ServiceAction/com.eweaver.document.file.FileDownload?&&loginIamge=1&&attachid=2c908a847530f5ca01756d0d6cf7614f');
        
        if (img.length === 0) {
            img[0] = '/images/login/login_slide1.jpg';
            img[1] = '/images/login/login_slide2.jpg';
            img[2] = '/images/login/login_slide3.jpg';
            img[3] = '/images/login/login_slide4.jpg';
        }
        for (let i = 0; i < 4; i++) {
            $('#disimg' + i).css('background', 'url(\'' + img[i] + '\') no-repeat');
        }
    }
</script>
