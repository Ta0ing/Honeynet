     /**
      * 修改密码  -->首次登录页面强制修改密码  弹框
      */
     function submitPassword3(){
    	  var loginName = $("#txtUsername").val();
     	var newPassword=$("#newPassword").val();
     	var checkNewPassword=$("#checkNewPassword").val();
     	var regExp=/^(?![a-zA-Z]+$)(?![A-Z0-9]+$)(?![A-Z\W_]+$)(?![a-z0-9]+$)(?![a-z\W_]+$)(?![0-9\W_]+$)[a-zA-Z0-9\W_]{8,20}$/;
     	if(!regExp.test(newPassword)){
             layui.use(['layer'], function () {
                 var layer = layui.layer;
                 layer.msg('8-20位字符，必须包含字母大写、小写、数字、特殊字符中至少3种格式。', {
                     time: 2000
                 });
             });
             $("#mima1").focus();
             return;
        }
         if(newPassword == $("#txtPassword").val()){
             layui.use(['layer'],function(){
                 var layer = layui.layer
                 layer.msg('对不起，为了您的账户安全，不能设置为当前登录密码！', {time: 2000,icon: 5});
             })
             return;
         }
     	if(newPassword==checkNewPassword){
            $.ajax({
                type:"post",
                url: '/service/staffInfo/updatePassword',
                data:{'newPassword':newPassword},
                 data: [
                    {name: 'newPassword', value: newPassword},
                    {name: 'loginName', value: loginName},
                ],
                datatype:"json",
                success:function(data){
                    var msg=data.msg;
                    if(msg){
                        layui.use(['layer'],function(){
                            var layer = layui.layer
                            layer.msg('密码修改成功，请重新登录。', {time: 2000,icon: 6});
                        })
                        window.setTimeout(function () {layui.layer.closeAll();}, 2000);
                    }else{
                        layer.msg('密码修改失败，请联系管理员 ', {
                            time: 2000
                        });
                    }
                }
            })
     	 }else{
     	     layer.msg('两次输入的密码不一致 ', {
     	     time: 2000
     	 });
       }

     }
